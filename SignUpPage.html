<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUpPage</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="wrapper-container">
      <div class="side-image">
        <img src="./Assets for Quiz User App/welcome.svg" alt="" srcset="" />
      </div>
      <div>
        <form action="" class="form-container">
          <label for="heading" class="heading">SignUp</label>
          <span class="grey-text">Sign Up to Join</span>
          <label for="emaii">Full Name <i>*</i></label>
          <input type="email" placeholder="Full Name" id="userName" />
          <label for="emaii">Email <i>*</i></label>
          <input type="email" placeholder="xyz12@gmail.com" id="userEmail" />
          <label for="Password">Password <i>*</i></label>
          <div class="password-with-eye">
            <input type="password" placeholder="Password" id="passwordFiled" />
            <i class="fa-solid fa-eye" id="togglePassword"></i>
          </div>
          <button class="login-button">Sign Up  </button>
          <button class="google-button">
            <img src="./Assets for Quiz User App/google.svg" alt="" srcset="" />
            <span>Sign Up with Google</span>
          </button>
          <div class="terms-checkbox" style="display: flex; width: 300px">
            <input type="checkbox" class="terms-box" /> <span>I accept Terms & Conditions</span>
          </div>
          <span> Have an account? <a href="./index.html"> Login? </a> </span>
        </form>
      </div>
    </div>
  </body>
  <script src="./main.js"></script>
</html>

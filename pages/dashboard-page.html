<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/Styles/style.css">
<body>
    <nav class="nav-bar">
        <div class="logo">
            <img src="/Assets/techoaathshala_logo.png" alt="" srcset="">
        </div>
        <div class="links-profile">
            <ul>
                <li>Edit Quizzes</li>
                <li>All Quizzes</li>
                <li><img src="/Assets/profile_picture.png" alt="" id="profileImg"></li>
                <li><Button id="logout" class="login-button" >Logout</Button></li>
            </ul>
        </div>
    </nav>
    <section class="heading-section">
        <h2>Let's Start the Quiz</h2>
        <span  class="grey-text"><i class="fa-solid fa-clock clock"> </i> 10 Mins</span>
        <ul>
            <li>You have to attempt all the questions</li>
            <li>Once submitted not able to edit test</li>
        </ul>
    <!-- </section> -->
    <section class="start-section">
       <div class="container">
        <img src="/Assets/Home Page Gray.png" alt="">
        <h2>Catchy Line for Starting Quiz</h2>
        <p>When you're done review your answer and See your rank</p>
        <button class="login-button" style="width: 30%;" onclick="toQuizApp()">Start Quiz</button>
       </div>
    </section>
</body>
<script src="/scripts/main.js"></script>
<script src="/Scripts/dashboard.js"></script>
</html>

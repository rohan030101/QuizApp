<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Page</title>
    <link rel="stylesheet" href="/Styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="nav-bar">
      <div class="logo">
        <img src="/Assets/techoaathshala_logo.png" alt="" srcset="" />
      </div>
      <div class="links-profile">
        <ul>
          <li>Edit Quizzes</li>
          <li>All Quizzes</li>
          <li class="exitQuiz" onclick="exitQuiz()">Exit</li>
          <!-- <li>
            <img src="/Assets/profile_picture.png" alt="" />
          </li> -->
        </ul>
      </div>
    </nav>
    <section class="question-section">
      <h2 class="question-numbers" id="noOfQuestions"></h2>
      <div class="progress-bar"></div>
      <p id="timer">30 Minutes</p>  
      <div class="question-option">
        <label for=""  id="questionText"></label>
        <ul id="options">
          <!-- <li><input type="radio" name="" id="" /> 1. Option</li>
          <li><input type="radio" name="" id="" /> 1. Option</li>
          <li><input type="radio" name="" id="" /> 1. Option</li>
          <li><input type="radio" name="" id="" /> 1. Option</li> -->
        </ul>
      </div>
      <div class="question-nagivation-buttons">
        <button id="previous"><i class="fa-solid fa-arrow-left"></i> Previous</button>
        <button id="submitAndNext">
          Submit & Continue <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </section>
  </body>
  <script src="/scripts/main.js"></script>
  <script src="/scripts//quizpage.js"></script>
</html>
